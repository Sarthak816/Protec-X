# Protec-X Production Deployment Configuration
# This file contains recommendations for production deployments

# Database Configuration
[database]
# Production database host (use managed service or replica set)
host = mysql.production.internal
port = 3306
database = ai_fraud_db_prod
user = produser
# Password should be stored in environment variables or secrets manager
# Never commit actual passwords
max_connections = 100
connection_timeout = 30

# Tomcat Configuration
[tomcat]
# JVM Heap Memory - adjust based on server resources
heap_min = 1024m
heap_max = 4096m
# Thread pool size
thread_pool_size = 200
# Connection timeout
connection_timeout = 30000
request_timeout = 600000

# Application Configuration
[application]
environment = production
debug = false
log_level = INFO
# Log rotation
log_max_size = 100m
log_max_files = 10

# Security Configuration
[security]
# Enable HTTPS/SSL
ssl_enabled = true
ssl_port = 8443
ssl_keystore_path = /opt/tomcat/conf/keystore.jks
ssl_keystore_password = ${KEYSTORE_PASSWORD}
# Security headers
enable_csrf = true
enable_cors = false
cors_origins = https://yourdomain.com

# Monitoring Configuration
[monitoring]
# Health check interval
health_check_interval = 30
# Alerting email
alert_email = ops@yourdomain.com
# Metrics collection
metrics_enabled = true
metrics_port = 9090

# Backup Configuration
[backup]
# Daily backup at 2 AM UTC
backup_schedule = 0 2 * * *
# Backup retention (days)
retention_days = 30
# Backup location
backup_path = /backup/protec-x/

# Performance Configuration
[performance]
# Database connection pool
pool_min_size = 10
pool_max_size = 100
# Cache configuration
cache_enabled = true
cache_ttl = 3600
# Rate limiting
rate_limit_enabled = true
rate_limit_requests_per_minute = 100

# Deployment Configuration
[deployment]
# Container orchestration (kubernetes, docker-compose, etc.)
orchestration = kubernetes
# Replica count for high availability
replicas = 3
# Rolling update strategy
update_strategy = rolling
max_surge = 1
max_unavailable = 0
