apiVersion: v1
kind: Namespace
metadata:
  name: protec-x

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: protec-x
data:
  database.properties: |
    db.url=jdbc:mysql://mysql:3306/ai_fraud_db
    db.user=frauddetector
    db.password=${DB_PASSWORD}

---
apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: protec-x
type: Opaque
stringData:
  root-password: ${MYSQL_ROOT_PASSWORD}
  user-password: ${MYSQL_PASSWORD}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: protec-x
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: root-password
        - name: MYSQL_DATABASE
          value: "ai_fraud_db"
        - name: MYSQL_USER
          value: "frauddetector"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: user-password
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        - name: init-script
          mountPath: /docker-entrypoint-initdb.d
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - -h
            - localhost
          initialDelaySeconds: 20
          periodSeconds: 5
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: mysql-pvc
      - name: init-script
        configMap:
          name: db-init-script

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: protec-x
spec:
  selector:
    app: mysql
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306
  type: ClusterIP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: protec-x
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: protec-x-app
  namespace: protec-x
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: protec-x-app
  template:
    metadata:
      labels:
        app: protec-x-app
    spec:
      containers:
      - name: app
        image: ghcr.io/sarthak816/protec-x:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: DB_URL
          value: "jdbc:mysql://mysql:3306/ai_fraud_db"
        - name: DB_USER
          value: "frauddetector"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: user-password
        - name: CATALINA_OPTS
          value: "-Xms512m -Xmx2048m"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2048Mi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: app-config
          mountPath: /usr/local/tomcat/webapps/ROOT/WEB-INF/classes
      volumes:
      - name: app-config
        configMap:
          name: app-config

---
apiVersion: v1
kind: Service
metadata:
  name: protec-x-app
  namespace: protec-x
  labels:
    app: protec-x-app
spec:
  type: LoadBalancer
  selector:
    app: protec-x-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    name: http

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: protec-x-app-hpa
  namespace: protec-x
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: protec-x-app
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
